name: Feature request
description: Suggest an improvement or a new language pack
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: markdown
    attributes:
      value: |
        Heads up: no scheduling, no AI image generation and no publishing without human approval are deliberate decisions — see `SPEC.md`.
